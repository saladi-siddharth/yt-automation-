name: Viral YouTube Long Video Generator

on:
  schedule:
    # -------------------------------------------------------------
    # 🎥 DAILY LONG VIDEOS (1x per day)
    # Starts at 17:00 IST (11:30 UTC) to generate, render & upload
    # scheduled for 18:00 IST publishing on YouTube.
    # -------------------------------------------------------------
    - cron: '30 11 * * *'  # 17:00 IST (11:30 UTC)

  # Allow manual triggering of Long Video generation from GitHub Actions UI
  workflow_dispatch:

jobs:
  generate_long_video:
    name: Generate & Publish Long Video
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Project Dependencies
        run: npm ci

      - name: Inject Secrets & Environment Variables
        run: |
          # Create .env file for configuration
          echo "PORT=3000" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "TIDB_PASSWORD=${{ secrets.TIDB_PASSWORD }}" >> .env
          
          # Create data directory
          mkdir -p data
          
          # Write YouTube OAuth Tokens from Secret
          echo '${{ secrets.YOUTUBE_TOKENS_JSON }}' > data/youtube_tokens.json
          
          # Set correct permissions
          chmod 600 data/youtube_tokens.json

      - name: Execute Long Video Automation Script
        run: npm run generate:long

      - name: Upload Logs & Manifest (On Failure/Success)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-video-outputs
          path: |
            output/
            data/
          retention-days: 3

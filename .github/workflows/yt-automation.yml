name: Viral YouTube Shorts Generator

on:
  schedule:
    # -------------------------------------------------------------
    # 🎬 DAILY SHORTS (3x per day)
    # Starts 15 mins before IST publish times (08:00, 16:00, 20:00 IST)
    # -------------------------------------------------------------
    - cron: '15 02 * * *'  # 07:45 IST (for 08:00 IST publish)
    - cron: '15 10 * * *'  # 15:45 IST (for 16:00 IST publish)
    - cron: '15 14 * * *'  # 19:45 IST (for 20:00 IST publish)

  # Allow manual triggering of Shorts from GitHub Actions UI
  workflow_dispatch:

jobs:
  generate_shorts:
    name: Generate & Publish Short
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Project Dependencies
        run: npm ci

      - name: Inject Secrets & Environment Variables
        run: |
          # Create .env file for configuration
          echo "PORT=3000" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}" >> .env
          echo "YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}" >> .env
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}" >> .env
          echo "TIDB_HOST=${{ secrets.TIDB_HOST }}" >> .env
          echo "TIDB_PORT=${{ secrets.TIDB_PORT }}" >> .env
          echo "TIDB_USER=${{ secrets.TIDB_USER }}" >> .env
          echo "TIDB_PASSWORD=${{ secrets.TIDB_PASSWORD }}" >> .env
          echo "TIDB_DATABASE=${{ secrets.TIDB_DATABASE }}" >> .env
          
          # Create data directory
          mkdir -p data
          
          # Write YouTube OAuth Tokens from Secret if present
          if [ -n "${{ secrets.YOUTUBE_TOKENS_JSON }}" ]; then
            echo '${{ secrets.YOUTUBE_TOKENS_JSON }}' > data/youtube_tokens.json
            chmod 600 data/youtube_tokens.json
          fi

      - name: Execute Shorts Automation Script
        run: npm run generate:short

      - name: Upload Logs & Manifest (On Failure/Success)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-video-outputs
          path: |
            output/
            data/
          retention-days: 3
